[osd]
position = "top_right"

[plugin_settings."joshuaslate/shelly"]
notify = true

[plugin_settings."leo/game-launcher"]
browser_placement = "attached"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/Videos/wallpapers"

[plugin_settings."noctalia/screen_recorder"]
audio_source = "none"
color_range = "limited"
video_codec = "hevc"

[plugin_settings."yogaeru/mango_layout"]
main_placement = "attached"

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "noctalia/wallhaven",
    "joshuaslate/shelly",
    "dotnetrob/cat",
    "oldirtty/color_picker",
    "tadomika_ari/w-engine"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "/home/ellie/Pictures/pfp/1116048351393695117.gif"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

[theme]
builtin = "Noctalia"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/ellie/Pictures/Wallpapers/wallhaven-rqj837.png"

    [wallpaper.last]
    path = "/home/ellie/Pictures/Wallpapers/wallhaven-rqj837.png"

    [wallpaper.monitors.DP-1]
    path = "/home/ellie/Pictures/Wallpapers/wallhaven-rqj837.png"

    [wallpaper.monitors.DP-2]
    path = "/home/ellie/Pictures/Wallpapers/wallhaven-rqj837.png"

[widget.Spacer]
length = 10
type = "spacer"

[widget.Spacer_2]
type = "spacer"

[widget.cat]
cat_size = 34
type = "dotnetrob/cat:cat"

[widget.date]
format = "{:%a %d %b -}"

[widget.launcher]
custom_image = "/usr/share/icons/hicolor/scalable/apps/org.cachyos.hello.svg"
scale = 1.45

[widget.network]
show_label = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.workspaces]
anchor = true
show_labels = false
