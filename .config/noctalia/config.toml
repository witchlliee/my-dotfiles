[backdrop]
blur_intensity = 0.64999998547136784
enabled = true

[bar.default]
background_opacity = 0.98999997787177563
center = [ "workspaces", "Spacer_2", "media", "Spacer_2", "cat" ]
contact_shadow = true
end = [
    "tray",
    "Spacer_2",
    "notifications",
    "clipboard",
    "caffeine",
    "recorder",
    "Spacer_2",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "Spacer_2",
    "date",
    "clock",
    "Spacer_2",
    "session",
    "Spacer"
]
margin_edge = 0
margin_ends = 0
radius = 0
radius_bottom_left = 15
radius_bottom_right = 15
radius_top_right = 0
scale = 1.1000000089406967
start = [ "Spacer", "launcher", "Spacer_2", "active_window" ]
thickness = 42

[dock]
cross_axis_padding = 2

[idle]
behavior_order = [ "lock", "Screen-off", "lock-and-suspend" ]

    [idle.behavior.Screen-off]
    action = "screen_off"
    enabled = false
    timeout = 30.0

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 40.0

    [idle.behavior.lock-and-suspend]
    action = "suspend"
    enabled = false
    lock_before_suspend = false
    timeout = 600.0

