config_version = 2

[backdrop]
blur_intensity = 0.64999998547136784
enabled = true

[bar.default]
background_opacity = 0.98999997787177563
center = [ "workspaces", "Spacer_2", "media" ]
contact_shadow = true
end = [
    "tray",
    "Spacer_2",
    "notifications",
    "clipboard",
    "caffeine",
    "recorder",
    "Spacer_2",
    "shelly",
    "Spacer_2",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "Spacer_2",
    "date",
    "clock",
    "Spacer_2",
    "session",
    "Spacer"
]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
scale = 1.1000000089406967
start = [ "Spacer", "launcher", "Spacer_2", "active_window" ]
thickness = 42

[dock]
cross_axis_padding = 2

[idle]
behavior_order = [ "lock", "Screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.Screen-off]
    action = "command"
    command = "jay randr output DP-1 disable; jay randr output DP-2 disable"
    enabled = true
    resume_command = "jay randr output DP-1 enable; jay randr output DP-2 enable"
    timeout = 180.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 250.0

    [idle.behavior.lock-and-suspend]
    action = "suspend"
    enabled = true
    lock_before_suspend = false
    timeout = 600.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@WL-1", "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@WL-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 611.0
    cy = 1191.0
    output = "WL-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WL-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[osd]
position = "top_right"

[plugin_settings."joshuaslate/shelly"]
notify = true

[plugin_settings."leo/game-launcher"]
browser_placement = "attached"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/Videos/wallpapers"

[plugin_settings."noctalia/screen_recorder"]
audio_source = "none"
color_range = "limited"
video_source = "focused"

[plugin_settings."yogaeru/mango_layout"]
main_placement = "attached"

[plugins]
enabled = [ "noctalia/screen_recorder", "leo/game-launcher", "noctalia/wallhaven", "noctalia/mpvpaper", "joshuaslate/shelly" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/Ahmed5Emad/Gamelauncher-Noctalia"
    name = "game-launcher"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/yogaeru/noctalia-plugins"
    name = "yogaeru"

[shell]
avatar_path = "/home/ellie/Pictures/pfp/1116048351393695117.gif"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    transparency_mode = "soft"

[theme]
builtin = "Noctalia"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/ellie/Pictures/Wallpapers/wallhaven-rqj837.png"

